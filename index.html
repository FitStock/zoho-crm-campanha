<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Campanha & Disparar E-mails - Fitstock</title>
    <!-- ZOHO CRM WIDGET SDK -->
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }
        
        /* TELA DE DEBUG EM DESTAQUE NO TOPO */
        .debug-panel {
            margin-bottom: 14px;
            background: #0f172a;
            color: #38bdf8;
            padding: 10px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
            max-height: 180px;
            overflow-y: auto;
            border: 2px solid #0284c7;
        }
        .debug-title {
            color: #f1f5f9;
            font-weight: bold;
            margin-bottom: 4px;
            border-bottom: 1px solid #334155;
            padding-bottom: 4px;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            padding: 14px;
            margin-bottom: 12px;
        }
        .card h3 { 
            margin: 0 0 10px 0; 
            font-size: 14px; 
            color: #0f172a; 
            border-bottom: 1px solid #f1f5f9; 
            padding-bottom: 6px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #475569; }
        input, select, textarea {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 12.5px;
            background: #fff;
        }
        textarea { resize: vertical; }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        .membros-list {
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 8px;
            background: #fafafa;
        }
        .membro-item {
            display: flex;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 12px;
        }
        .membro-item:last-child { border-bottom: none; }
        .btn-select-all {
            background: #e2e8f0;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            color: #334155;
        }
        .btn-select-all:hover { background: #cbd5e1; }
        .btn-submit {
            width: 100%;
            background: #059669;
            color: #ffffff;
            border: none;
            padding: 11px;
            border-radius: 6px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: #047857; }
        .status { margin-top: 10px; font-size: 12.5px; padding: 8px 10px; border-radius: 6px; display: none; }
        .status.loading { display: block; background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
        .status.success { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .status.error { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>

<!-- CONSOLE DE DEBUG FIXADO NO TOPO -->
<div class="debug-panel">
    <div class="debug-title">🔍 CONSOLE DE MONITORAMENTO REAL-TIME (FITSTOCK)</div>
    <div id="debugLog">Aguardando inicialização da Widget SDK...</div>
</div>

<div class="card">
    <h3>1. Dados da Campanha</h3>
<div class="form-group">
    <label for="responsavelSelect">Responsável</label>
    <select id="responsavelSelect" disabled aria-describedby="responsavelStatus"></select>
    <small id="responsavelStatus" role="status" style="display:block;margin-top:5px;color:#64748b;">Carregando responsáveis...</small>
</div>
    <div class="form-group">
        <label for="nomeCampanha">Nome da Campanha *</label>
        <input type="text" id="nomeCampanha" placeholder="Carregando...">
    </div>
    <div class="row">
        <div class="form-group">
            <label for="tipoCampanha">Tipo *</label>
            <select id="tipoCampanha">
                <option value="Email">Email</option>
                <option value="Telemarketing">Telemarketing</option>
                <option value="Webinar">Webinar</option>
                <option value="Outro">Outro</option>
            </select>
        </div>
        <div class="form-group">
            <label for="statusCampanha">Status *</label>
            <select id="statusCampanha">
                <option value="Em andamento">Em andamento</option>
                <option value="Planejada">Planejada</option>
                <option value="Concluída">Concluída</option>
            </select>
        </div>
    </div>
</div>

<div class="card">
    <h3>
        <span>2. Destinatários (Contacts associados com e-mail)</span>
        <div>
            <button class="btn-select-all" onclick="marcarTodos(true)">Todos</button>
            <button class="btn-select-all" onclick="marcarTodos(false)">Nenhum</button>
        </div>
    </h3>
    <div id="membrosContainer" class="membros-list">
        <div style="font-size: 12px; color: #64748b;">Carregando contatos associados à oportunidade...</div>
    </div>
</div>

<div class="card">
    <h3>3. E-mail da Campanha (Editável)</h3>
    <div class="form-group">
        <label for="assuntoInput">Assunto do E-mail</label>
        <input type="text" id="assuntoInput" placeholder="Carregando...">
    </div>
    <div class="form-group">
        <label for="corpoInput">Mensagem (Com Variáveis {{Nome_Contato}} e {{Nome_Empresa}})</label>
        <textarea id="corpoInput" rows="5" placeholder="Carregando..."></textarea>
    </div>
</div>

<button id="campanhaButton" disabled class="btn-submit" onclick="executarCampanha()">Criar Campanha e Disparar E-mails</button>
<div id="status" class="status"></div>

<script>
    const FUNCTION_API_NAME = "dispararcampanhawidget";

// Responsável: usuário conectado por padrão; somente usuários ativos do CRM.
let responsaveisProntos = false;
let responsavelGeracao = 0;
let responsaveisAtivos = new Set();
async function carregarResponsaveis() {
    const generation = ++responsavelGeracao;
    responsaveisProntos = false;
    responsaveisAtivos = new Set();
    const select = document.getElementById("responsavelSelect");
    const status = document.getElementById("responsavelStatus");
    select.disabled = true;
    select.replaceChildren();
    status.textContent = "Carregando responsáveis...";
    try {
        const currentResponse = await ZOHO.CRM.CONFIG.getCurrentUser();
        const current = currentResponse?.users?.[0] || currentResponse;
        if (!current?.id) throw Error("Usuário conectado não identificado.");
        const users = new Map();
        let complete = false;
        for (let page = 1; page <= 10; page++) {
            const response = await ZOHO.CRM.API.getAllUsers({Type: "ActiveUsers", page, per_page: 200});
            if (!Array.isArray(response?.users) || response.code) throw Error("Lista de usuários indisponível.");
            for (const user of response.users) {
                if (user.status === "active" && /^\d+$/.test(String(user.id))) users.set(String(user.id), user);
            }
            if (response.info?.more_records === false || (response.info?.more_records !== true && response.users.length < 200)) { complete = true; break; }
        }
        if (!complete) throw Error("Lista de usuários incompleta.");
        if (generation !== responsavelGeracao) return;
        const currentId = String(current.id);
        if (!users.has(currentId)) throw Error("Usuário conectado não está disponível como responsável ativo.");
        for (const user of [...users.values()].sort((a,b) => String(a.full_name || a.last_name || a.id).localeCompare(String(b.full_name || b.last_name || b.id), "pt-BR"))) {
            const option = document.createElement("option");
            option.value = String(user.id);
            option.textContent = (user.full_name || user.last_name || user.id) + (option.value === currentId ? " (você)" : "");
            select.append(option);
        }
        responsaveisAtivos = new Set(users.keys());
        select.value = currentId;
        responsaveisProntos = true;
        select.disabled = false;
        status.textContent = "Pré-selecionado com seu usuário. Você pode escolher outro responsável.";
    } catch (error) {
        if (generation !== responsavelGeracao) return;
        status.textContent = "Não foi possível carregar os responsáveis. Reabra o formulário para tentar novamente.";
        select.replaceChildren();
        select.disabled = true;
    }
}
function responsavelSelecionado() {
    const id = document.getElementById("responsavelSelect").value;
    return responsaveisProntos && responsaveisAtivos.has(id) ? id : null;
}
    let currentOppId = null;
    let campanhaPronta = false;
    let criandoCampanha = false;

    function logDebug(title, data) {
        const d = document.getElementById("debugLog");
        const strData = (typeof data === "object") ? JSON.stringify(data, null, 2) : String(data);
        d.innerHTML += `<br><strong>[${new Date().toLocaleTimeString()}] ${escapeHtml(title)}:</strong> <span style="color:#a5f3fc;">${escapeHtml(strData)}</span>`;
        d.scrollTop = d.scrollHeight;
    }

    function setStatus(msg, type) {
        const s = document.getElementById("status");
        if (!type) { s.style.display = "none"; return; }
        s.textContent = msg;
        s.className = "status " + type;
    }

    function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[char]);
    }

    function marcarTodos(status) {
        document.querySelectorAll(".chk-membro").forEach(chk => chk.checked = status);
    }

    function parseStrictJson(response) {
        if (!response) return null;
        let rawStr = "";

        if (typeof response === "string") rawStr = response;
        else if (response.details && response.details.output) rawStr = response.details.output;
        else if (response.output) rawStr = response.output;
        else if (response.userMessage) rawStr = response.userMessage;

        logDebug("RAW OUTPUT", rawStr);

        if (typeof rawStr === "object" && rawStr !== null) return rawStr;

        if (typeof rawStr === "string") {
            try {
                return JSON.parse(rawStr);
            } catch(e) {
                logDebug("ERRO PARSE JSON", e.message);
            }
        }
        return null;
    }

    async function carregarDados() {
        campanhaPronta = false;
        document.getElementById("campanhaButton").disabled = true;
        if (!currentOppId) {
            setStatus("ID da Oportunidade não identificado.", "error");
            logDebug("ERRO CRÍTICO", "oppId veio vazio.");
            return;
        }

        setStatus("Carregando contatos associados e produto...", "loading");
        logDebug("CHAMANDO DELUGE", { oppId: currentOppId });

        const reqData = { arguments: JSON.stringify({ oppId: currentOppId }) };

        try {
            await carregarResponsaveis();
            const response = await ZOHO.CRM.FUNCTIONS.execute(FUNCTION_API_NAME, reqData);
            logDebug("RESPOSTA BRUTA SDK", response);

            const dataObj = parseStrictJson(response);
            logDebug("OBJETO PARSADO", dataObj);

            if (dataObj && dataObj.status === "success" && Array.isArray(dataObj.empresas)) {
                const pNome = dataObj.produto_nome || "Produto";
                const qtd = dataObj.quantidade || "Consulte-nos";

                document.getElementById("nomeCampanha").value = `Campanha Fitstock - ${pNome}`;
                document.getElementById("assuntoInput").value = `Oportunidade Comercial: ${pNome} disponível na Fitstock`;

                const templateTexto = `Olá {{Nome_Contato}}, tudo bem?\n\nIdentificamos uma oportunidade exclusiva para a {{Nome_Empresa}} referente ao fornecimento do item ${pNome}.\n\nTemos um lote disponível com as seguintes condições de mercado:\n- Produto: ${pNome}\n- Quantidade Disponível: ${qtd}\n\nCaso tenham demanda para este produto ou queiram alinhar condições de negociação, entrem em contato diretamente com o nosso time comercial:\n\n📲 André Grell: +55 11 99312-2497 ( https://wa.me/5511993122497?text=Olá%20André,%20tenho%20interesse%20no%20produto%20${encodeURIComponent(pNome)} )\n📲 Natália: +55 11 91123-5550 ( https://wa.me/5511911235550?text=Olá%20Natália,%20tenho%20interesse%20no%20produto%20${encodeURIComponent(pNome)} )\n\nFicamos no aguardo do seu retorno!\n\nAtenciosamente,\nEquipe Fitstock`;

                document.getElementById("corpoInput").value = templateTexto;

                const container = document.getElementById("membrosContainer");
                let htmlMembros = "";

                dataObj.empresas.forEach(emp => {
                    if (emp.contatos && emp.contatos.length > 0) {
                        emp.contatos.forEach(ct => {
                            htmlMembros += `
                                <div class="membro-item">
                                    <label style="margin:0; font-weight:normal; cursor:pointer; display:flex; align-items:center; gap:6px;">
                                        <input type="checkbox" class="chk-membro" checked
                                            data-empresa-id="${escapeHtml(emp.id)}"
                                            data-empresa-nome="${escapeHtml(emp.nome)}"
                                            data-contato-id="${escapeHtml(ct.id)}"
                                            data-contato-nome="${escapeHtml(ct.nome)}"
                                            data-email="${escapeHtml(ct.email)}">
                                        <span><strong>${escapeHtml(emp.nome)}</strong> - ${escapeHtml(ct.nome)} (<em>${escapeHtml(ct.email)}</em>)</span>
                                    </label>
                                </div>
                            `;
                        });
                    }
                });

                if (!htmlMembros) {
                    container.innerHTML = "<div style='font-size:12px; color:#ef4444; padding:4px;'>Nenhum contato associado com e-mail. Vincule contatos na lista Contacts da oportunidade pelo botão Assign.</div>";
                } else {
                    container.innerHTML = htmlMembros;
                }

                campanhaPronta = true;
                document.getElementById("campanhaButton").disabled = !responsaveisProntos;
                setStatus("", "");
            } else {
                document.getElementById("membrosContainer").textContent = "";
                setStatus(dataObj?.message || "Falha ao retornar lista de destinatários.", "error");
                logDebug("MOTIVO FALHA", "empresas não é um Array ou veio vazio.");
            }
        } catch (e) {
            setStatus("Erro de comunicação com o servidor.", "error");
            logDebug("EXCEÇÃO JS", e.stack || e.message);
        }
    }

    async function executarCampanha() {
        if (criandoCampanha || !campanhaPronta) return;
        const responsavelId = responsavelSelecionado();
        if (!responsavelId) { setStatus("Selecione um responsável ativo.", "error"); return; }
        const nomeCamp = document.getElementById("nomeCampanha").value;
        const tipoCamp = document.getElementById("tipoCampanha").value;
        const statusCamp = document.getElementById("statusCampanha").value;
        const assunto = document.getElementById("assuntoInput").value;
        const corpo = document.getElementById("corpoInput").value.replace(/\n/g, "<br>");

        const checkboxes = document.querySelectorAll(".chk-membro:checked");
        if (checkboxes.length === 0) {
            alert("Selecione pelo menos um contato para disparar a campanha.");
            return;
        }

        const membros = [];
        checkboxes.forEach(chk => {
            membros.push({
                empresa_id: chk.getAttribute("data-empresa-id"),
                nome_empresa: chk.getAttribute("data-empresa-nome"),
                contato_id: chk.getAttribute("data-contato-id"),
                nome_contato: chk.getAttribute("data-contato-nome"),
                email: chk.getAttribute("data-email")
            });
        });

        criandoCampanha = true;
        document.getElementById("campanhaButton").disabled = true;
        document.getElementById("responsavelSelect").disabled = true;
        setStatus("Criando campanha e disparando e-mails...", "loading");

        const payload = {
            Owner: {id: responsavelId},
            nome_campanha: nomeCamp,
            tipo_campanha: tipoCamp,
            status_campanha: statusCamp,
            assunto_email: assunto,
            corpo_email: corpo,
            membros: membros
        };

        const reqData = {
            arguments: JSON.stringify({ action: "executar_campanha", payload: payload, oppId: currentOppId })
        };

        try {
            const response = await ZOHO.CRM.FUNCTIONS.execute(FUNCTION_API_NAME, reqData);
            logDebug("EXECUÇÃO RESPOSTA", response);

            const outExec = parseStrictJson(response);
            if (outExec && outExec.status === "success") {
                setStatus(`Campanha criada com sucesso! ${outExec.total_disparados} e-mails enviados. Redirecionando...`, "success");
                setTimeout(() => {
                    ZOHO.CRM.UI.Record.open({ Entity: "Campaigns", RecordID: outExec.campanha_id });
                }, 1500);
            } else {
                setStatus("Erro ao executar campanha.", "error");
            }
        } catch (e) {
            setStatus("Falha de comunicação com o backend.", "error");
            logDebug("ERRO EXECUÇÃO", e.message);
        }
    }

    function inicializarCapturaID() {
        if (typeof ZOHO === "undefined") {
            setTimeout(inicializarCapturaID, 150);
            return;
        }

        ZOHO.embeddedApp.on("PageLoad", function(data) {
            logDebug("PAGELOAD DATA", data);
            extrairEProcessarID(data);
        });

        ZOHO.embeddedApp.init().then(function() {
            logDebug("SDK INIT OK", "Iniciado");
            if (!currentOppId) {
                ZOHO.CRM.INTERACTOR.getRecord().then(function(dataRecord) {
                    logDebug("INTERACTOR RECORD", dataRecord);
                    if (dataRecord && dataRecord.recordId) {
                        extrairEProcessarID({ EntityId: dataRecord.recordId });
                    }
                }).catch(function(err){
                    logDebug("INTERACTOR ERR", err);
                });
            }
        });
    }

    function extrairEProcessarID(data) {
        if (currentOppId) return;

        if (data) {
            if (data.EntityId) {
                currentOppId = Array.isArray(data.EntityId) ? data.EntityId[0] : data.EntityId;
            } else if (data.EntityIdList && data.EntityIdList.length > 0) {
                currentOppId = data.EntityIdList[0];
            } else if (data.recordId) {
                currentOppId = data.recordId;
            }
        }

        logDebug("OPP ID DEFINIDO", currentOppId);

        if (currentOppId) {
            carregarDados();
        } else {
            setStatus("Não foi possível capturar o ID da Oportunidade.", "error");
        }
    }

    inicializarCapturaID();
</script>
</body>
</html>
